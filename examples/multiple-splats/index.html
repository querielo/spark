<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • Multiple Splats</title>
  <style>
    body {
      margin: 0;
    }

    a,
    footer {
      color: #797979
    }

    footer {
      position: absolute;
      margin: 10px;
      bottom: 0;
    }
  </style>
</head>

<body>
  <script type="importmap">
    {
      "imports": {
        "three": "../js/vendor/three/build/three.module.js",
        "three/webgpu": "../js/vendor/three/build/three.webgpu.js",
        "three/tsl": "../js/vendor/three/build/three.tsl.js",
        "three/addons/": "/examples/js/vendor/three/examples/jsm/",
        "@sparkjsdev/spark": "../../dist/spark.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { WebGPURenderer } from "three/webgpu";
    import { SparkWebGpuRenderer, SplatMesh, PackedSplats } from "@sparkjsdev/spark";
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { getAssetFileURL } from "../js/get-asset-url.js";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 6.5);
    camera.lookAt(0, 0, 0);

    const renderer = new WebGPURenderer();
    await renderer.init();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(new THREE.Color(0xFFFFFF), 1);

    const spark = new SparkWebGpuRenderer({ renderer });
    scene.add(spark);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(3, 4, 5);
    scene.add(keyLight);
    scene.add(new THREE.HemisphereLight(0xbfd7ff, 0x2a1a10, 1.4));

    const standardMeshes = new THREE.Group();
    scene.add(standardMeshes);

    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(1.25, 1.4, 0.28, 64),
      new THREE.MeshStandardMaterial({
        color: 0x365f78,
        metalness: 0.15,
        roughness: 0.42,
      }),
    );
    pedestal.position.set(0, -1.35, 0);
    standardMeshes.add(pedestal);

    const occluder = new THREE.Mesh(
      new THREE.BoxGeometry(0.72, 0.72, 0.72),
      new THREE.MeshStandardMaterial({
        color: 0xf07f4f,
        metalness: 0.05,
        roughness: 0.35,
      }),
    );
    occluder.position.set(-0.78, -0.42, 0.56);
    standardMeshes.add(occluder);

    const backSphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.46, 48, 32),
      new THREE.MeshStandardMaterial({
        color: 0x77b255,
        metalness: 0.0,
        roughness: 0.5,
      }),
    );
    backSphere.position.set(1.05, -0.25, -0.72);
    standardMeshes.add(backSphere);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.68, 0.045, 16, 96),
      new THREE.MeshStandardMaterial({
        color: 0x2d2d34,
        metalness: 0.55,
        roughness: 0.28,
      }),
    );
    ring.rotation.x = Math.PI * 0.5;
    ring.position.y = -0.2;
    standardMeshes.add(ring);

    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let splatURL = await getAssetFileURL("butterfly-ai.spz");
    const butterflySplats = new PackedSplats({ url: splatURL });
    const butterflies = [];
    for (let i = 0; i < 6; i++) {
      const splat = new SplatMesh({ packedSplats: butterflySplats });
      splat.quaternion.set(1, 0, 0, 0);
      scene.add(splat);
      butterflies.push(splat);
    }

    splatURL = await getAssetFileURL("cat.spz");
    const cat = new SplatMesh({ url: splatURL });
    cat.quaternion.set(1, 0, 0, 0);
    cat.scale.setScalar(0.5);
    scene.add(cat);

    // Setup mouse controls to orbit the camera around
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.minDistance = 0.3;
    controls.maxDistance = 20;
    controls.update();

    const RADIUS = 2;

    renderer.setAnimationLoop(function animate(time) {
      controls.update();

      // Rotate food
      for (let i = 0; i < butterflies.length; i++) {
        const ang = (-time / 10000) + i / butterflies.length * Math.PI * 2;
        butterflies[i].position.set(Math.cos(ang) * RADIUS, Math.sin(ang) * RADIUS - 0.2, 0);
        butterflies[i].rotation.y = i + time / 4000;
      }

      // Animate food master
      cat.position.y = -0.8 + Math.sin(time / 1000) * 0.1;

      occluder.rotation.set(time / 1800, time / 2400, time / 2100);
      backSphere.position.y = -0.25 + Math.sin(time / 900) * 0.16;
      ring.rotation.z = time / 3000;

      renderer.render(scene, camera);
    });
  </script>
</body>

</html>
